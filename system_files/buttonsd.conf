# buttonsd config for Yandex Station Street (mango)
# Changes need: /etc/init.d/S98buttonsd restart

devices=/dev/input/event0,/dev/input/event2,/dev/input/event3

# 1 = exclusive grab (only when maind is disabled; steals events from maind!)
grab=0

# Do not run actions while maind --platformd is alive (prevents double presses
# in normal mode). In bunker mode maind is absent, so actions are active.
suspend_with_maind=1

# When maind is absent, stop the boot animations and zero all LEDs after 6 s.
led_init=1

hook_dir=/data/opt/etc/buttons.d
log=/data/opt/var/log/buttonsd.log
pid_file=/data/opt/var/run/buttonsd.pid

volume_step=5
long_ms=900
repeat_delay_ms=500
repeat_ms=180

# Per-action command overrides. A hook script in $hook_dir wins over these.
# cmd_activate=/data/opt/etc/buttons.d/on_activate.sh
# cmd_activate_long=/data/opt/etc/buttons.d/on_activate_long.sh
# cmd_volume_up=/system/vendor/quasar/set_volume.sh +5
# cmd_volume_down=/system/vendor/quasar/set_volume.sh -5
# cmd_mute=/data/opt/bin/buttons_mute.sh
# cmd_power=...
# cmd_power_long=/sbin/poweroff
# cmd_play_pause=...
# cmd_bluetooth=...

# Remap raw Linux key codes if needed:
# map_582=activate
# map_113=mute
# map_116=power
